# ============================================================
# Gate configuration — HUMAN-EDITABLE ONLY.
# Agents MUST NOT modify this file. Orchestrator reads it at bootstrap.
# mode: manual  -> orchestrator posts gate report, waits for human comment
#                  "GATE APPROVED" or "GATE REJECTED: <reason>" on the ticket
# mode: auto    -> orchestrator verifies all criteria, passes gate, logs evidence
# ============================================================

gates:
  G1:
    name: requirements-approved
    transition: "Refining -> Ready"
    mode: manual              # manual | auto
    criteria:                 # ALL must pass (checked in both modes; in manual
                              # mode they gate the report, human is final say)
      - id: gherkin_present
        check: "Requirement spec contains >= 1 Gherkin acceptance criterion"
      - id: out_of_scope_declared
        check: "Out-of-scope section is present and non-empty"
      - id: no_open_questions
        check: "Open-questions section is empty"
      - id: size_ok
        check: "Estimated size <= 1 dev-day, otherwise story must be split first"

  G2:
    name: merge-to-main
    transition: "In Review -> Done (PR merge)"
    mode: manual
    criteria:
      - id: pr_exists
        check: "PR exists and targets main"
      - id: ci_green
        check: "All GitHub Actions status checks pass"
      - id: reviewer_approve
        check: "Reviewer verdict comment is APPROVE"
      - id: checklist_complete
        check: "Every item in review checklist has an explicit result"
      - id: coverage_met
        check: "Coverage >= profile.quality.coverage_threshold"

# Module-provided gates are appended below by the module enablement
# procedure (docs/05 §3). Example:
# G3:
#   name: deploy-to-production
#   module: deployment
#   mode: manual
#   criteria: [...]
