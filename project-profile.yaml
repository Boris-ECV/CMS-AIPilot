# ============================================================
# PROJECT PROFILE — the ONLY place project-specific facts live.
# Agents read this before running any build/test/lint command. (docs/04)
# ============================================================

project:
  name: "CMS AI Pilot"
  jira_key: "SDLCAIP1"
  repo: "github.com/Boris-ECV/CMS-AIPilot"
  default_branch: main
  description: >
    具備前後台的 CMS 系統。後台提供網頁介面編輯文章,每次編輯發布後產生全靜態
    HTML 檔案並上傳覆蓋 AWS S3 上的舊檔;前台完全是靜態檔案,不拉資料庫內容。

stack:
  language: "python 3.12"
  frameworks: [fastapi, mangum, react, vite]
  database: "DynamoDB"
  notes: >
    後端 FastAPI + Mangum 跑在 AWS Lambda 上(serverless),前端 React+Vite
    SPA 作為後台編輯介面(不對外服務,前台輸出物是靜態 HTML)。IaC 用 AWS CDK
    (Python)。前端骨架尚未建立,將在第一個涉及後台 UI 的 Story 時建立。

commands:
  setup: "pip install -e \".[dev]\""
  build: ""
  test: "pytest -q"
  lint: "ruff check ."
  coverage: "pytest --cov=src --cov-report=term-missing -q"

quality:
  coverage_threshold: 70
  lint_zero_tolerance: true

conventions:
  code_style: "PEP8 via ruff (see pyproject.toml [tool.ruff])"
  commit_format: "<type>(<JIRA-KEY>): <summary>"
  branch_format: "story/<JIRA-KEY>-<slug>"
  test_layout: "tests/ mirrors src/ structure; tests/e2e/ holds Playwright e2e tests"
  notes: >
    e2e 測試用 Playwright(Python, pytest-playwright plugin)。API 測試用
    pytest + httpx 直接測 FastAPI app。e2e 測試在前端骨架建立前先以
    pytest.mark.skip 佔位——僅限骨架建立前。骨架建立後，每張涉及 UI 的
    Story，tester 必須在 Testing 階段宣告是否需要 e2e 並補上真正執行的
    測試，不可繼續沿用 skip 佔位（見 docs/02 §3.3、gates.yaml G2
    e2e_declared_and_honored）。

structure:
  src: "src/cms_aipilot/"
  tests: "tests/ (tests/e2e/ for Playwright)"
  docs: "docs/ (framework docs, not product docs)"

deployment:
  environments: []
  notes: "AWS serverless(Lambda + DynamoDB + S3 + API Gateway),IaC 用 AWS CDK(Python)。部署模組尚未啟用,v1 手動部署。"

# ------------------------------------------------------------
# jira_custom_field_ids — 補 config/jira-workflow.yaml 沒講的一塊:
# 該檔案定義的自訂欄位(Agent Lock 等)在 Jira API 裡是用
# customfield_XXXXX 當 key,不是顯示名稱。這裡是本專案 SDLCAIP1
# 實際建立後的名稱→ID 對照。orchestrator 讀寫這些欄位時應優先用
# 這份對照表,不要落到 jira-workflow.yaml 的留言降級模式
# (fallback_when_no_custom_fields)——那個 fallback 是給欄位真的
# 建不出來的情況用的,不是這裡。
# ------------------------------------------------------------
jira_custom_field_ids:
  "Agent Lock": customfield_11719
  "Lock Timestamp": customfield_11721
  "Reopen Count": customfield_11722
  "Human Touch Count": customfield_11723
  "Stage Entered At": customfield_11724
